<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Tilt+Warp&display=swap" rel="stylesheet">
    <img src="background.jpg" style="width: 200px;">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
    }

       body {
        background-image: ('public1/cristina-gottardi-CSpjU6hYo_0-unsplash.jpg');
        background-size: cover;
        background-position: center;
        display: grid;
        place-items: center;
        font-family: 'Tilt Warp', cursive;
        color: rgb(118, 14, 163);
    }


    h1 {
        margin: 50px 0 50px 0;
        font-size: 5rem;
        color: rgb(158, 183, 32);
        -webkit-text-stroke: .5px black;
    }

    input {
        margin-bottom: 20px;
        padding: 5px;
        font-size: 1.2rem;
    }

    button {
        font-size: 1.2rem;
        margin-bottom: 10px;
    }

    img {
        width: 30px;
    }

    #cont {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
    }

    .btn {
        font-size: 2rem;
        width: 100px;
        height: 100px;
        cursor: pointer;
        margin: 0;
        background-color: rgb(206, 203, 203);
        border-radius: 10px;
    }
    .container {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-top: 2rem;
    }

    #find {
        font-size: 1.5rem;
        color: white;
        cursor: pointer;
        padding: 7px;
        border-radius: 10px;
        width: 250px;
        background-color: rgb(0, 0, 0);
    }

    .btn:hover {
        background-color: rgb(226, 228, 230);
            
    }

    button.enabled {
        opacity: 1;
    }

    p {
        font-size: 4rem;
    }

    @media (max-width: 600px) {
    h1 {
        font-size: 1.5rem;
    }

    .container {
        width: 90%;
        grid-template-columns: repeat(3, 1fr);
    }

    .btn {
        width: 80px;
        height: 80px;
        font-size: 2rem;
    }

    #restartBtn, #muteBtn {
        font-size: 0.9rem;
    }

    #message {
        font-size: 1.2rem;
    }
}


</style>

<body>

    <h1>Tic-Tac-Toe</h1>

    <div style="display: flex; width: 95vw; position: relative;">
        <p id="userCont">You : <span id="user"></span></p>
        <p style="position: absolute; right: 0;" id="oppNameCont">Opponent : <span id="oppName"></span></p>
    </div>
    <br>
    <p id="valueCont">You are playing as <span id="value"></span></p>
    <br>
    <p id="whosTurn">X's Turn</p>
    <div>
        <p style="font-size: 1.2rem;" id="enterName">Enter your name : </p>
        <input type="text" placeholder="Name" id="name" autocomplete="off">
    </div>
    <button id="find">Search for a player</button>
    <img id="loading" src="loading.gif" alt="">

    <div id="bigcont">
        <div id="cont">
            <button id="btn1" class="btn"></button>
            <button id="btn2" class="btn"></button>
            <button id="btn3" class="btn"></button>
            <button id="btn4" class="btn"></button>
            <button id="btn5" class="btn"></button>
            <button id="btn6" class="btn"></button>
            <button id="btn7" class="btn"></button>
            <button id="btn8" class="btn"></button>
            <button id="btn9" class="btn"></button>
        </div>
    </div>

    <div id="message"></div> 

    <div style="margin-top: 20px;">
              <button id="restartBtn" onclick="restartGame()" style="padding: 10px 20px; font-size: 1rem;">🔁 Rematch</button>
     </div>

    <div style="margin-top: 10px;">
          <button id="muteBtn" onclick="toggleMute()" style="padding: 5px 10px;">🔊 Mute</button>
    </div>



    <!-- Audio elements for sound effects -->
    <audio id="winSound">
        <source src="congratulations-deep-voice-172193.mp3" type="audio/mp3">
    </audio>
    <audio id="drawSound">
        <source src="draw-sword1-44724.mp3" type="audio/mp3">
    </audio>
    <audio id="clickSound">
        <source src="bubble-pop-6395.mp3" type="audio/mp3">
    </audio>
    <audio id="bgMusic" loop autoplay>
        <source src="background-music.mp3" type="audio/mp3">
    </audio>


    <script src="/socket.io/socket.io.js"></script>
    <script src="/socket.io/socket.io.js"></script>
<script>
    document.getElementById("loading").style.display = "none";
    document.getElementById("bigcont").style.display = "none";
    document.getElementById("userCont").style.display = "none";
    document.getElementById("oppNameCont").style.display = "none";
    document.getElementById("valueCont").style.display = "none";
    document.getElementById("whosTurn").style.display = "none";

    const socket = io();

    let name = "";
    let roomId = "";
    let isMuted = false;
    

    document.getElementById('find').addEventListener("click", function () {
        name = document.getElementById("name").value;
        document.getElementById("user").innerText = name;

        if (!name.trim()) {
            alert("Please enter a name");
        } else {
            socket.emit("find", { name: name });
            document.getElementById("loading").style.display = "block";
            document.getElementById("find").disabled = true;
        }
    });




    function toggleMute() {
        const audios = document.querySelectorAll("audio");
        audios.forEach(audio => audio.muted = !isMuted);
        isMuted = !isMuted;
        document.getElementById("muteBtn").innerText = isMuted ? "🔇 Unmute" : "🔊 Mute";
    }



    function restartGame() {
        location.reload(); // Quick restart: refreshes the page
    }


    socket.on("find", (e) => {
        const { players, currentTurn } = e;
        roomId = e.roomId;

        let value, oppName;
        if (players.X.name === name) {
            value = "X";
            oppName = players.O.name;
        } else {
            value = "O";
            oppName = players.X.name;
        }

        document.getElementById("value").innerText = value;
        document.getElementById("oppName").innerText = oppName;

        document.getElementById("userCont").style.display = "block";
        document.getElementById("oppNameCont").style.display = "block";
        document.getElementById("valueCont").style.display = "block";
        document.getElementById("loading").style.display = "none";
        document.getElementById("name").style.display = "none";
        document.getElementById("find").style.display = "none";
        document.getElementById("enterName").style.display = "none";
        document.getElementById("bigcont").style.display = "block";
        document.getElementById("whosTurn").style.display = "block";
        document.getElementById("whosTurn").innerText = `${currentTurn}'s Turn`;
    });

    document.querySelectorAll(".btn").forEach((btn, idx) => {
        btn.addEventListener("click", function () {
            const value = document.getElementById("value").innerText;

            if (btn.innerText === "") {
                document.getElementById("clickSound").play();
                socket.emit("playing", {
                    roomId,
                    index: idx,
                    value,
                    name
                });
            }
        });
    });

    socket.on("playing", (e) => {
        const { board, currentTurn } = e;
        document.getElementById("whosTurn").innerText = `${currentTurn}'s Turn`;

        board.forEach((val, idx) => {
            const btn = document.getElementById(`btn${idx + 1}`);
            if (val && btn.innerText === "") {
                btn.innerText = val;
                btn.disabled = true;
                btn.style.color = "black";
            }
        });

        checkWinOrDraw(board);
    });

    function checkWinOrDraw(board) {
    const winSound = document.getElementById("winSound");
    const drawSound = document.getElementById("drawSound");
    const message = document.getElementById("message");
    const value = document.getElementById("value").innerText; // 'X' or 'O'

    const lines = [
        [0, 1, 2], [3, 4, 5], [6, 7, 8],
        [0, 3, 6], [1, 4, 7], [2, 5, 8],
        [0, 4, 8], [2, 4, 6]
    ];

    for (let [a, b, c] of lines) {
        if (board[a] && board[a] === board[b] && board[b] === board[c]) {
            winSound.play();
            message.innerText = `${board[a]} is the Winner!`;
            disableBoard();

            if (board[a] === value) {
                document.getElementById("valueCont").innerHTML = `<span style="color: green;">🎉 You are the Winner!</span>`;
            } else {
                document.getElementById("valueCont").innerHTML = `<span style="color: red;">❌ You lost the game</span>`;
            }

            return;
        }
    }

    if (board.every(cell => cell !== null)) {
        drawSound.play();
        message.innerText = `It's a Draw!`;
        document.getElementById("valueCont").innerHTML = `<span style="color: orange;">🤝 It's a Draw!</span>`;
    }
}


    function disableBoard() {
        document.querySelectorAll(".btn").forEach(btn => btn.disabled = true);
    }

    socket.on("gameOver", ({ message }) => {
        document.getElementById("message").innerText = message;
        disableBoard();
    });
</script>





</body>

</html>
